name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint (tsc + eslint + prettier)
        run: npm run lint:all

      - name: Unit tests (Vitest)
        run: npm run test
